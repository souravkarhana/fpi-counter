name: Update FPI holders Excel

on:
  workflow_dispatch:          # Actions tab -> "Run workflow" button
  schedule:
    - cron: "30 4 1 * *"      # har mahine 1 tarikh, 10:00 AM IST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fpi_holders.py
      - uses: actions/upload-artifact@v4
        with:
          name: fpi_holders
          path: fpi_holders.xlsx
      - name: Commit Excel to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fpi_holders.xlsx
          git diff --cached --quiet || git commit -m "Update FPI holders data"
          git push
